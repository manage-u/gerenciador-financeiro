/* Cartões: roda tipo disco visto de cima (0.20) */
html[data-ui] .card.cc-carrossel{background:linear-gradient(180deg,#1a1e2c,#11141d);color:#eef0f5;border:0;box-shadow:0 22px 40px -24px rgba(10,12,20,.7)}
.card.cc-carrossel h2{color:#eef0f5}
.card.cc-carrossel h2::before{background:#a78bfa}
.card.cc-carrossel .note{color:#9aa3b2}
.card.cc-carrossel .cc-nav .gh{width:50px;height:50px;min-width:50px;min-height:50px;border-radius:50%;padding:0;background:linear-gradient(135deg,#7c3aed,#4f46e5);color:#fff;border:0;box-shadow:0 10px 22px -8px rgba(124,58,237,.7)}
.card.cc-carrossel .cc-nav .gh:first-child{background:#252a3a;box-shadow:none}
.cc-wrap{display:grid;gap:16px;min-width:0}
.cc-side,.cc-main{min-width:0;display:grid;gap:16px;align-content:start}
.cc-carrossel h2,.cc-det h2{margin:0 0 4px}
.cc-wheel{--cw:128px;--ch:80px;--R:98px;--hub:104px;position:relative;width:300px;max-width:100%;aspect-ratio:1;margin:6px auto 0;border-radius:50%;background:radial-gradient(circle,#262c3e 0 52%,#171c29 53%,#0a0d14 100%);box-shadow:0 20px 40px -20px rgba(0,0,0,.6),inset 0 0 0 1px rgba(255,255,255,.06);touch-action:none;overflow:hidden;outline:none;cursor:grab;user-select:none}
.cc-wheel:active{cursor:grabbing}
.cc-wheel:focus-visible{box-shadow:0 0 0 3px var(--ac)}
@media(min-width:600px){.cc-wheel{--cw:150px;--ch:94px;--R:112px;--hub:120px;width:340px}}
.cc-slot{position:absolute;left:50%;top:50%;width:0;height:0}

function addMonths(date,n){const d=P(date),day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+n);d.setDate(Math.min(day,dim(d.getFullYear(),d.getMonth())));return iso(d)}
const mAdd=(ym,n)=>{const d=new Date(+ym.slice(0,4),+ym.slice(5,7)-1+n,1);return d.getFullYear()+'-'+pad(d.getMonth()+1)};
const dimYM=ym=>dim(+ym.slice(0,4),+ym.slice(5,7)-1);
const refLabel=ref=>MES[+ref.slice(5,7)-1]+'/'+ref.slice(0,4);
const cardById=id=>S.cards.find(c=>c.id==id);
// Compra feita até o dia de fechamento cai na fatura que fecha naquele mês; depois, na seguinte.
const invRef=(c,ds)=>{const ym=ds.slice(0,7);return (+ds.slice(8)<=Math.min(c.fecha,dimYM(ym)))?ym:mAdd(ym,1)};
const closeDate=(c,ref)=>ref+'-'+pad(Math.min(c.fecha,dimYM(ref)));
// Vencimento cai no mesmo mês do fechamento se venc > fecha; senão, no mês seguinte.
const dueDate=(c,ref)=>{const ym=c.venc>c.fecha?ref:mAdd(ref,1);return ym+'-'+pad(Math.min(c.venc,dimYM(ym)))};
function occ(b,to){const s=P(b.data),r=[];if(!b.rec)return s<=to?[{date:b.data,key:mk(b.data)}]:[];
 for(let i=0;;i++){const k=addMonths(b.data,i),d=P(k);if(d>to||(b.fim&&k>b.fim))break;r.push({date:k,key:mk(k)})}return r}

  for(let i=0;i<np;i++){const ref=mAdd(r0,i),key=x.cardId+'|'+ref;
   const inv=map[key]||(map[key]={key,cardId:x.cardId,cardName:(card&&card.nome)||x.cardName||'Cartão',ref,fecha:card?closeDate(card,ref):ref+'-01',due:card?dueDate(card,ref):ref+'-01',items:[],total:0});
   const v=installmentValue(x,i+1);inv.items.push({xid:x.id,desc:x.descricao,n:i+1,of:np,valor:v,cat:x.cat||'Outros',data:x.data});inv.total+=v}});

function investir(){const{ini,apm,prz,cdi,ipca,cdb,lci,spr}=S,d=prz*30,ir=d<=180?.225:d<=360?.2:d<=720?.175:.15;
 const defs=[['Poupança',cdi>8.5?Math.pow(1.005,12)-1:.7*cdi/100,0,'isenta de IR'],[`CDB ${cdb}% do CDI`,cdi/100*cdb/100,1,'IR regressivo'],[`LCI/LCA ${lci}% do CDI`,cdi/100*lci/100,0,'isenta de IR'],['Tesouro Selic',cdi/100-.003,1,'IR regressivo, com taxa B3'],[`Tesouro IPCA+ (${spr}% + IPCA)`,(1+ipca/100)*(1+spr/100)-1-.002,1,'IR regressivo, com taxa B3']];
 const ap=ini+apm*prz;
 const rows=defs.map(([n,a,t,nt])=>{const m=Math.pow(1+a,1/12)-1;let v=ini;for(let i=0;i<prz;i++)v=v*(1+m)+apm;const imp=t?(v-ap)*ir:0,liq=v-imp;return{n,nt,liq,imp,rend:liq-ap,real:liq/Math.pow(1+ipca/100,prz/12),an:a*(t?1-ir:1)}}).sort((x,y)=>y.liq-x.liq),mx=rows[0].liq;
 return `<div class="card"><div class="row">${fld('ini','Valor inicial (R$)')}${fld('apm','Aporte mensal (R$)')}${fld('prz','Prazo (meses)','1')}${fld('cdi','CDI anual (%)')}${fld('ipca','Inflação anual (%)')}${fld('cdb','CDB (% do CDI)')}${fld('lci','LCI/LCA (% do CDI)')}${fld('spr','IPCA+ (taxa fixa %)')}</div>
 <p class="note">Edite o CDI e o IPCA com os valores de hoje; os padrões são só um ponto de partida.</p></div>
 <div class="card"><div class="hero"><h2 style="margin:0">Em ${prz} meses você teria</h2><span class="mu">investido: ${R0(ap)}</span></div>
 ${rows.map((r,i)=>`<div class="inv"><div class="li" style="border:0;padding:0 0 6px"><div>${r.n} ${i==0?'<span class="tag">melhor</span>':''}<small>${r.nt}${r.imp?' · IR '+R0(r.imp):''}</small></div><div class="rt">${R0(r.liq)}</div></div><div class="tr"><i style="width:${r.liq/mx*100}%;background:${i==0?'var(--ac)':'var(--mu)'};opacity:${i==0?1:.5}"></i></div>

 <p class="note">Estimativa: o IR regressivo é aplicado ao rendimento total pelo prazo final, e aportes recentes pagariam alíquota maior. Rentabilidade passada ou projetada não garante resultado. Reserva no horizonte hoje: ${S.rend}% ao ano.</p></div>`}

(function(){
 function fire(ev,name,bubble){let el=ev.target;if(!(el instanceof Element))el=el.parentElement;
  while(el){const k=el.getAttribute('data-on-'+name);if(k&&HND[k])HND[k](el,ev);if(!bubble)break;el=el.parentElement}}
 ['click','change','input','mousedown','paste','drop'].forEach(n=>document.addEventListener(n,ev=>fire(ev,n,true)));
 document.addEventListener('focusout',ev=>fire(ev,'focusout',false));
})();
</script>
<script>
document.addEventListener('pointerdown',e=>{const w=e.target.closest&&e.target.closest('#ccArc');if(!w||e.target.closest('.cc-go'))return;CDRAG={id:e.pointerId,last:e.clientY,moved:0,tap:e.target.closest('.cc-card')};try{w.setPointerCapture(e.pointerId)}catch(_){}});
document.addEventListener('pointermove',e=>{if(!CDRAG||e.pointerId!==CDRAG.id)return;const dy=e.clientY-CDRAG.last;CDRAG.last=e.clientY;CDRAG.moved+=Math.abs(dy);const N=ccN();CANG=Math.min(20,Math.max(-(N-1)*CC_PASSO-20,CANG+dy*0.6));ccPaint(false);ccSync()});
function ccFimArraste(e){if(!CDRAG||e.pointerId!==CDRAG.id)return;const D=CDRAG;CDRAG=null;if(!ccN())return;if(D.moved<5&&D.tap){const ti=+D.tap.dataset.cci;if(!ccPC()&&ti===ccIdx()){CVIEW='detalhe';render()}else ccSnap(-ti*CC_PASSO)}else{ccSnapNear()}}
document.addEventListener('toggle',e=>{if(e.target&&e.target.classList&&e.target.classList.contains('cc-novo-top')&&document.getElementById('ccArc'))ccPaint(false)},true);
document.addEventListener('pointerup',ccFimArraste);
document.addEventListener('pointercancel',ccFimArraste);
document.addEventListener('wheel',e=>{const w=e.target.closest&&e.target.closest('#ccArc');if(!w)return;e.preventDefault();if(!ccN())return;CANG=Math.min(20,Math.max(-(ccN()-1)*CC_PASSO-20,CANG+(e.deltaY>0?-CC_PASSO*0.5:CC_PASSO*0.5)));ccPaint(false);ccSync();clearTimeout(CTIMER);CTIMER=setTimeout(ccSnapNear,160)},{passive:false});
document.addEventListener('keydown',e=>{const w=document.getElementById('ccArc');if(!w||document.activeElement!==w)return;if(e.key==='ArrowRight'||e.key==='ArrowDown'){ccStep(1);e.preventDefault()}else if(e.key==='ArrowLeft'||e.key==='ArrowUp'){ccStep(-1);e.preventDefault()}});
window.addEventListener('resize',()=>ccPaint(true));
</script>
